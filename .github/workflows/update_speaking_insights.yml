name: Update Speaking Insights

on:
  # Codex automation "yrtan.com 月末内容更新" handles bilingual content updates
  # at 20:00 Asia/Shanghai on the last day of each month.
  # Keep this CEIBS-only updater available for manual runs.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-speaking-insights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test speaking updater
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Update speaking page from CEIBS
        run: python scripts/update_speaking_from_ceibs.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- _pages/speaking.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push speaking updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _pages/speaking.md
          git commit -m "Update speaking insights from CEIBS"
          git push
